# Publica la tienda en GitHub Pages automáticamente.
# Se ejecuta solo cada vez que subes un cambio a la rama main.
name: Publicar la tienda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Bajar los archivos
        uses: actions/checkout@v4

      - name: Encender GitHub Pages si hace falta
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
